<!-- 사용법·설치법 보기 · §6-157 · 저장소 안의 `.md` 를 화면에서 그대로 읽는다 -->
<section class="docs-panel workspace-panel hidden" data-workspace-panel="docs" aria-label="사용법">
  <div class="section-head workspace-page-head">
    <div>
      <strong>사용법</strong>
      <small id="docsSubtitle">프로젝트 만들기부터 스케줄·상황별 루틴까지</small>
    </div>
    <div class="docs-head-actions">
      <div class="docs-picker" id="docsPicker" role="tablist" aria-label="문서 고르기"></div>
      <input id="docsSearchInput" type="search" placeholder="문서 안에서 찾기" aria-label="문서 안에서 찾기">
      <button id="docsReloadButton" type="button">다시 읽기</button>
    </div>
  </div>

  <div class="docs-body">
    <nav class="docs-outline" id="docsOutline" aria-label="차례"></nav>
    <article class="docs-article" id="docsArticle" tabindex="-1">
      <p class="docs-placeholder">문서를 읽는 중입니다</p>
    </article>
  </div>

  <div class="docs-footer">
    <span id="docsSourceLabel"></span>
    <span class="docs-footer-hint">화면 캡처는 <code>docs/images/</code> 에 넣고 문서에서 <code>![설명](images/파일.png)</code> 로 부릅니다</span>
  </div>
</section>
