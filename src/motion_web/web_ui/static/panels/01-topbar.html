<!-- 상단바 · 비상정지 배너 · 작업화면 탭
     `index.html`에서 떼어낸 조각 · 원본 22~89줄 · §6-44
     들여쓰기를 그대로 둔다 · 서버가 자리표시자 줄을 이 내용으로 바꾼다 -->
      <header class="topbar">
        <div class="app-title">
          <h1>모션 녹화 시스템</h1>
          <span class="version-badge">버전 0.5.0</span>
          <a id="globalGitVersion" class="version-badge git-version-badge" title="Git 상태 로드 중..." href="#" target="_blank" rel="noopener" style="margin-left: 8px; cursor: help; display: none;"></a>
          <!-- 어느 PC 의 화면인지 늘 보인다 · §6-100 · 여러 PC 를 한 사람이
               띄워 놓고 쓰는데, 탭을 옮겨야 알 수 있으면 엉뚱한 PC 에 명령을
               내린다 -->
          <span id="globalPcName" class="version-badge pc-name-badge" style="margin-left: 8px; display: none;"></span>
          <div
            id="motorActivityBanner"
            class="motor-activity-banner"
            role="status"
            aria-live="polite"
            aria-hidden="true"
          >
            <span id="motorActivityIndicator" aria-hidden="true"></span>
            <strong id="motorActivityLabel"></strong>
          </div>
        </div>
        <div class="topbar-operations" aria-label="중요 시스템 조작">
          <div class="topbar-operation-status">
            <span id="headerProjectName" class="header-project-name" title="현재 프로젝트">프로젝트 없음</span>
            <span id="headerContextState" class="header-context-state waiting" title="저장 설정과 실행 설정 일치 여부">설정 확인 중</span>
          </div>
          <span class="topbar-operation-divider" aria-hidden="true"></span>
          <div class="topbar-operation-buttons">
            <div class="topbar-operation-group topbar-safety-actions" aria-label="정지 조작">
              <button id="headerMotionStopButton" class="header-motion-stop" type="button" title="전체 모터 동작을 정지하고 서보 ON을 유지합니다">전체 동작 정지</button>
              <button id="headerEmergencyStopButton" class="header-emergency-stop" type="button" aria-keyshortcuts="Control+Shift+E" title="전체 동작을 정지하고 AC 서보를 끈 뒤 명령을 잠급니다 (Ctrl+Shift+E)">긴급 정지</button>
            </div>
            <span class="topbar-operation-divider" aria-hidden="true"></span>
            <div class="topbar-operation-group topbar-restart-actions" aria-label="재시작 및 스케줄 조작">
              <span id="scheduleStatusBadge" class="badge bg-secondary me-2" style="font-size: 12px; padding: 4px 8px; border-radius: 4px; background-color: #4a5568; color: #fff;">스케줄러: 확인 중</span>
              <button id="btnScheduleModal" type="button" class="primary" style="background-color: #2b6cb0; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer;">📅 모션 스케줄</button>
              <button id="headerProgramRestartButton" type="button" disabled>프로그램 재시작</button>
            </div>
          </div>
        </div>
      </header>
      <div id="emergencyStopBanner" class="emergency-stop-banner hidden" role="alert">
        긴급정지 잠김 · 모터 동작 명령이 차단되었습니다 · 프로그램 재시작 필요
      </div>
      <nav id="workspaceTabs" class="workspace-navigation" aria-label="작업 화면">
        <div class="workspace-group-tabs" role="tablist" aria-label="작업 분류">
          <button class="workspace-group-button active" type="button" role="tab" data-workspace-group="operations">운영</button>
          <button class="workspace-group-button" type="button" role="tab" data-workspace-group="setup">프로젝트·장비</button>
          <button class="workspace-group-button" type="button" role="tab" data-workspace-group="creation">모션 제작</button>
          <button class="workspace-group-button" type="button" role="tab" data-workspace-group="execution">실행·시험</button>
        </div>
        <div class="workspace-tabs" data-workspace-group-panel="operations" role="tablist" aria-label="운영 메뉴">
          <button class="workspace-tab-button active" type="button" role="tab" data-workspace-tab="monitoring">실시간 모니터링</button>
          <button class="workspace-tab-button" type="button" role="tab" data-workspace-tab="servo-errors">서보 에러 관리</button>
          <button class="workspace-tab-button" type="button" role="tab" data-workspace-tab="log">로그</button>
          <button class="workspace-tab-button" type="button" role="tab" data-workspace-tab="btop">PC 성능 (btop)</button>
          <button class="workspace-tab-button" type="button" role="tab" data-workspace-tab="terminal">터미널</button>
        </div>
        <div class="workspace-tabs hidden" data-workspace-group-panel="setup" role="tablist" aria-label="프로젝트 및 장비 메뉴">
          <button class="workspace-tab-button" type="button" role="tab" data-workspace-tab="system">시스템 정보</button>
          <button class="workspace-tab-button" type="button" role="tab" data-workspace-tab="project">프로젝트 관리</button>
          <button class="workspace-tab-button" type="button" role="tab" data-workspace-tab="config">모터 관리</button>
        </div>
        <div class="workspace-tabs hidden" data-workspace-group-panel="creation" role="tablist" aria-label="모션 제작 메뉴">
          <button class="workspace-tab-button" type="button" role="tab" data-workspace-tab="motion-mapping">모션축 설정</button>
          <button class="workspace-tab-button" type="button" role="tab" data-workspace-tab="motion-midi">MIDI 입력 설정</button>
          <button class="workspace-tab-button" type="button" role="tab" data-workspace-tab="studio">모션 스튜디오</button>
        </div>
        <div class="workspace-tabs hidden" data-workspace-group-panel="execution" role="tablist" aria-label="실행 및 시험 메뉴">
          <button class="workspace-tab-button" type="button" role="tab" data-workspace-tab="manual">동작 테스트</button>
          <button class="workspace-tab-button" type="button" role="tab" data-workspace-tab="motion-run">모션 실행</button>
          <button class="workspace-tab-button" type="button" role="tab" data-workspace-tab="coordination">PC 연동 설정</button>
        </div>
      </nav>
