<!-- 전역 모달 · 팝업
     `index.html`에서 떼어낸 조각 · 원본 1843~1999줄 · §6-44
     들여쓰기를 그대로 둔다 · 서버가 자리표시자 줄을 이 내용으로 바꾼다 -->
    <div id="projectFileActionMenu" class="project-file-action-menu hidden" role="menu" aria-label="프로젝트 파일 관리">
      <strong id="projectFileActionTitle">프로젝트 파일</strong>
      <button id="projectFileOpenEditorButton" type="button" role="menuitem" disabled>기능 탭에서 열기</button>
      <button id="projectFileRenameButton" type="button" role="menuitem" disabled>이름 변경</button>
      <button id="projectFileActivateButton" type="button" role="menuitem" disabled>현재 설정으로 선택</button>
      <button id="projectFileExportButton" type="button" role="menuitem" disabled>외부로 내보내기</button>
      <div class="project-file-action-divider"></div>
      <button id="projectFileDeleteButton" class="off" type="button" role="menuitem" disabled>휴지통으로 이동</button>
    </div>

    <div id="operationProgressModal" class="operation-progress-overlay hidden" role="dialog" aria-live="polite" aria-modal="true" aria-labelledby="operationProgressTitle">
      <section class="operation-progress-dialog">
        <div class="operation-progress-head">
          <div id="operationProgressSpinner" class="operation-progress-spinner" aria-hidden="true"></div>
          <div>
            <strong id="operationProgressTitle">작업 진행 중</strong>
            <span id="operationProgressElapsed">경과 0.0초</span>
          </div>
          <b id="operationProgressState" data-state="running">진행 중</b>
        </div>
        <p id="operationProgressMessage">작업 상태를 확인하고 있습니다.</p>
        <div id="operationProgressDetail" class="operation-progress-detail">응답 대기</div>
        <div id="operationProgressLog" class="operation-progress-log hidden" aria-label="작업 진행 기록"></div>
        <div class="operation-progress-actions">
          <button id="operationProgressClearButton" class="hidden" type="button" disabled>내용 지우기</button>
          <button id="operationProgressCloseButton" class="primary" type="button" disabled>진행 중</button>
        </div>
      </section>
    </div>

    <div id="appDialogModal" class="app-dialog-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="appDialogTitle">
      <section class="app-dialog">
        <strong id="appDialogTitle">확인</strong>
        <p id="appDialogMessage"></p>
        <label id="appDialogInputWrap" class="app-dialog-input hidden">
          <span>입력값</span>
          <input id="appDialogInput" type="text" autocomplete="off">
        </label>
        <div class="app-dialog-actions">
          <button id="appDialogCancelButton" type="button">취소</button>
          <button id="appDialogConfirmButton" class="primary" type="button">확인</button>
        </div>
      </section>
    </div>

    <div id="motorErrorPopup" class="motor-error-popup hidden" role="alert" aria-live="assertive" aria-labelledby="motorErrorTitle">
      <div class="motor-error-dialog">
        <div class="motor-error-header">
          <strong id="motorErrorTitle">모터 에러 발생</strong>
        </div>
        <p id="motorErrorMessage">동작을 멈추고 모터 상태와 드라이버 알람을 확인하세요.</p>
        <div id="motorErrorList" class="motor-error-list"></div>
        <div class="motor-error-actions">
          <button id="motorErrorConfirmButton" type="button" class="primary">확인</button>
        </div>
      </div>
    </div>

    <!-- Schedule Management Modal -->
    <div id="scheduleModal" class="operation-progress-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 9999;" role="dialog">
      <div class="operation-progress-dialog" style="background: #1a202c; color: #fff; width: 680px; max-width: 90%; margin: 60px auto; padding: 24px; border-radius: 8px; border: 1px solid #2d3748; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
        <div class="d-flex justify-content-between align-items-center mb-3" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <h4 style="margin: 0; font-size: 18px; font-weight: bold;">📅 모션 구동 스케줄 관리</h4>
            <span id="schedulePcCurrentTime" style="font-size: 13px; color: #63b3ed; font-weight: bold; background: #2c5282; padding: 3px 10px; border-radius: 12px;">🕒 PC 시각: --:--:--</span>
          </div>
          <button id="btnCloseScheduleModal" type="button" style="background: none; border: none; color: #a0aec0; font-size: 20px; cursor: pointer;">&times;</button>
        </div>
        <!-- 고정 문구였다 · 연동을 켠 적 없는 PC 에도 "마스터 PC 전용" 이라고
             떴다 · 이제 상태에 따라 갈린다 · §6-133 -->
        <p id="scheduleScopeNotice" class="schedule-scope-notice">
          스케줄러 상태를 확인하고 있습니다.
        </p>
        <!-- 스케줄이 태어난 시간대와 이 PC 가 어긋났다 · §6-150
             들고 나갔는데 시간대만 안 바뀐 경우를 여기서 잡는다 -->
        <p id="scheduleTimezoneDrift" class="schedule-timezone-drift"></p>
        <!-- 스케줄이 실행을 관리하는가 · 사람이 정한다 · §6-143
             전에는 「사람이 멈췄나」를 요청 내용으로 추측했다 · 그룹 정지나
             안전 정지까지 사람이 멈춘 것으로 읽어 오판했다. -->
        <div class="schedule-mode-switch">
          <label for="scheduleRunMode">실행 관리</label>
          <select id="scheduleRunMode">
            <option value="schedule">스케줄 모드 · 시각에 맞춰 시작·정지</option>
            <option value="manual">수동 모드 · 스케줄이 손대지 않음</option>
          </select>
        </div>
        <div id="scheduleListContainer" style="max-height: 350px; overflow-y: auto; margin-bottom: 20px; background: #2d3748; padding: 12px; border-radius: 6px;">
          <div class="text-center text-muted py-4">스케줄 목록을 불러오는 중...</div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
          <button id="btnAddSchedule" type="button" style="background: #319795; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">+ 신규 스케줄 추가</button>
        </div>
      </div>
    </div>

    <!-- Schedule Edit/Create Modal -->
    <div id="scheduleEditModal" class="operation-progress-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 10000;" role="dialog">
      <div class="operation-progress-dialog" style="background: #2d3748; color: #fff; width: 500px; max-width: 90%; margin: 80px auto; padding: 24px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
        <h5 style="margin-top: 0; margin-bottom: 16px; font-weight: bold;">스케줄 설정</h5>
        <input type="hidden" id="schedEditId">
        <div style="display: flex; flex-direction: column; gap: 12px; font-size: 14px;">
          <div>
            <label style="display: block; margin-bottom: 4px;">스케줄 이름</label>
            <input type="text" id="schedName" style="width: 100%; padding: 6px; background: #1a202c; border: 1px solid #4a5568; color: white; border-radius: 4px;">
          </div>
          <div>
            <label style="display: block; margin-bottom: 4px;">시작 시각 (HH:MM:SS)</label>
            <input type="text" id="schedStartTime" value="09:00:00" style="width: 100%; padding: 6px; background: #1a202c; border: 1px solid #4a5568; color: white; border-radius: 4px;">
          </div>
          <!-- 정지 방식은 하나다 · §6-137
               「유지시간(초)」는 뺐다 · 시작한 순간부터 세는 값이라 프로그램이
               재시작하면 카운트가 사라져, 상태로 보는 방식과 맞지 않았다. -->
          <div>
            <label style="display: block; margin-bottom: 4px;">종료 시각 (HH:MM:SS)</label>
            <input type="text" id="schedStopTime" value="18:00:00" style="width: 100%; padding: 6px; background: #1a202c; border: 1px solid #4a5568; color: white; border-radius: 4px;">
            <small style="display: block; margin-top: 4px; color: #a0aec0;">시작보다 이른 시각이면 자정을 넘긴 것으로 봅니다 (예: 23:00 → 01:00)</small>
          </div>
          <div>
            <label style="display: block; margin-bottom: 4px;">반복 유형</label>
            <select id="schedRepeatType" style="width: 100%; padding: 6px; background: #1a202c; border: 1px solid #4a5568; color: white; border-radius: 4px;">
              <option value="daily">매일 (Daily)</option>
              <option value="weekly">주간 지정 (Weekly)</option>
              <option value="once">1회만 실행 (Once)</option>
            </select>
          </div>
          <div id="schedWeeklyDaysGroup" style="display: none;">
            <label style="display: block; margin-bottom: 4px;">구동 요일 선택</label>
            <div style="display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px;">
              <label style="display: flex; align-items: center; gap: 3px;"><input type="checkbox" class="sched-day-check" value="MON" checked> 월</label>
              <label style="display: flex; align-items: center; gap: 3px;"><input type="checkbox" class="sched-day-check" value="TUE" checked> 화</label>
              <label style="display: flex; align-items: center; gap: 3px;"><input type="checkbox" class="sched-day-check" value="WED" checked> 수</label>
              <label style="display: flex; align-items: center; gap: 3px;"><input type="checkbox" class="sched-day-check" value="THU" checked> 목</label>
              <label style="display: flex; align-items: center; gap: 3px;"><input type="checkbox" class="sched-day-check" value="FRI" checked> 금</label>
              <label style="display: flex; align-items: center; gap: 3px;"><input type="checkbox" class="sched-day-check" value="SAT"> 토</label>
              <label style="display: flex; align-items: center; gap: 3px;"><input type="checkbox" class="sched-day-check" value="SUN"> 일</label>
            </div>
          </div>
          <div id="schedOnceDateGroup" style="display: none;">
            <label style="display: block; margin-bottom: 4px;">실행 날짜 (YYYY-MM-DD)</label>
            <input type="date" id="schedRunDate" style="width: 100%; padding: 6px; background: #1a202c; border: 1px solid #4a5568; color: white; border-radius: 4px;">
          </div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
          <button id="btnCancelScheduleForm" type="button" style="background: #4a5568; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer;">취소</button>
          <button id="btnSaveScheduleForm" type="button" style="background: #3182ce; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold;">저장</button>
        </div>
      </div>
    </div>
