# 워크스페이스 pytest 설정 · 로드맵 0단계
#
# 실행 · pytest                (자체 패키지 전체)
#        pytest -m "not slow"  (느린 것 제외)
#        pytest src/motion_common
#
# 경로를 매번 나열하지 않도록 testpaths를 고정한다. motion_system은 별도 저장소
# (보호 대상)이고 자체 스타일 검사가 실패 상태라 기본 대상에서 뺀다.

[pytest]
testpaths =
    src/motion_common
    src/motion_coordination
    src/motion_control_studio
    src/motion_web

norecursedirs =
    build
    install
    log
    backups
    .git
    src/motion_system
    *.egg-info
    __pycache__

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 실패를 조용히 넘기지 않는다 · 경고는 보이되 실패로 만들지는 않는다
addopts =
    --strict-markers
    --strict-config
    -ra

markers =
    slow: 수 초 이상 걸리는 검사 (다중 프로세스 락 등)
    hardware: 실물 장비가 있어야 통과하는 검사
